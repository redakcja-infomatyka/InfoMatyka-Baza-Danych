<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="Arial, sans-serif">
  <title>Koło i okrąg – środek, promień, średnica, cięciwa</title>
  <rect width="480" height="340" fill="#ffffff"/>
  <circle cx="200" cy="170" r="130" fill="#ecfdf5" stroke="#047857" stroke-width="4"/>
  <line x1="70" y1="170" x2="330" y2="170" stroke="#2563eb" stroke-width="3"/>
  <line x1="200" y1="170" x2="292" y2="78" stroke="#dc2626" stroke-width="3"/>
  <line x1="108" y1="262" x2="292" y2="262" stroke="#7c3aed" stroke-width="3" transform="translate(0,-14)"/>
  <circle cx="200" cy="170" r="5" fill="#0f172a"/>
  <text x="188" y="196" font-size="18" fill="#0f172a">S</text>
  <text x="250" y="114" font-size="18" fill="#dc2626" font-style="italic">r</text>
  <text x="352" y="96" font-size="17" fill="#dc2626">promień</text>
  <text x="352" y="176" font-size="17" fill="#2563eb">średnica d = 2r</text>
  <text x="352" y="254" font-size="17" fill="#7c3aed">cięciwa</text>
  <text x="352" y="306" font-size="17" fill="#047857">okrąg (brzeg koła)</text>
</svg>
