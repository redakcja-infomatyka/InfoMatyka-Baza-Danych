<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" font-family="Arial, sans-serif">
  <title>Trójkąt prostokątny z oznaczeniami boków</title>
  <rect width="480" height="340" fill="#ffffff"/>
  <polygon points="80,280 400,280 80,60" fill="#e0f2fe" stroke="#0369a1" stroke-width="4" stroke-linejoin="round"/>
  <polyline points="80,250 110,250 110,280" fill="none" stroke="#0369a1" stroke-width="3"/>
  <path d="M352 280 A48 48 0 0 0 361 253" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="330" y="268" font-size="20" fill="#b45309" font-style="italic">α</text>
  <text x="240" y="314" font-size="26" fill="#0f172a" font-style="italic" text-anchor="middle">a</text>
  <text x="52" y="178" font-size="26" fill="#0f172a" font-style="italic" text-anchor="middle">b</text>
  <text x="258" y="160" font-size="26" fill="#0f172a" font-style="italic" text-anchor="middle">c</text>
  <text x="66" y="300" font-size="18" fill="#475569">C</text>
  <text x="404" y="300" font-size="18" fill="#475569">B</text>
  <text x="66" y="54" font-size="18" fill="#475569">A</text>
  <text x="300" y="70" font-size="20" fill="#0f172a">a² + b² = c²</text>
</svg>
